name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # commits recorded checksums back to main

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: catalog
      url: https://catalog.accessiblegames.net/index-meta.json
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Record missing checksums of developer files
        run: uv run catalog-checksums
      - name: Commit recorded checksums
        # Pushes made with the workflow token start no workflows, so this cannot loop. If main moved
        # meanwhile the push is skipped; the index below still carries the values, and the next
        # publish records them again.
        run: |
          if [ -z "$(git status --porcelain entries)" ]; then
            echo "No new checksums."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entries
          git commit -m "chore: record checksums of developer files"
          git push origin HEAD:main || echo "::warning::main moved during publish; checksums will be recorded by the next publish"
      - name: Build index
        run: uv run catalog-index --out site
      - name: Deploy the catalog Worker (wrangler.jsonc)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: deploy
