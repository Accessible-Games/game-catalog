name: mirror

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Mirror new sources
        run: uv run catalog-mirror
      - name: Open a pull request with the new mirror sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain entries)" ]; then
            echo "No new mirror sources."
            exit 0
          fi
          branch="mirror/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add entries
          git commit -m "chore: add mirror sources"
          git push origin "$branch"
          gh pr create \
            --title "Add mirror sources" \
            --body "Automated: mirrors new sources to files.accessiblegames.net." \
            --label mirror
