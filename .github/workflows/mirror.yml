name: mirror

# Manual only. The mirror preserves files at risk of disappearing (abandoned freeware, shaky
# developer sites); it is not a copy of every catalog file. Run it for the entries you choose:
#   gh workflow run mirror.yml -f entries="some-game another-game"
on:
  workflow_dispatch:
    inputs:
      entries:
        description: "Entry ids to preserve on the mirror, separated by spaces"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency: { group: mirror, cancel-in-progress: false }

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      ENTRY_IDS: ${{ inputs.entries }}
    steps:
      - name: Check the entry ids
        run: |
          if [ -z "$(echo $ENTRY_IDS)" ]; then echo "Name at least one entry id." >&2; exit 1; fi
          for id in $ENTRY_IDS; do
            case "$id" in
              *[!a-z0-9-]*|-*) echo "Not an entry id: $id" >&2; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Mirror the named entries
        run: uv run catalog-mirror --only $ENTRY_IDS
      - name: Open a pull request with the new mirror sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain entries)" ]; then
            echo "No new mirror sources."
            exit 0
          fi
          branch="mirror/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add entries
          git commit -m "chore: add mirror sources for $ENTRY_IDS"
          git push origin "$branch"
          gh pr create \
            --title "Mirror: $ENTRY_IDS" \
            --body "Preserves the files of these entries on files.accessiblegames.net (manual mirror run)." \
            --label mirror
