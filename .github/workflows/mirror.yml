name: mirror

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: { group: mirror, cancel-in-progress: false }

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Skip while a mirror pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count="$(gh pr list --label mirror --state open --json number --jq length)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "A mirror pull request is already open. Merge or close it; the merge starts a new mirror run."
          fi
      - uses: actions/checkout@v7
        if: steps.open.outputs.count == '0'
      - uses: astral-sh/setup-uv@v7
        if: steps.open.outputs.count == '0'
      - run: uv sync --locked
        if: steps.open.outputs.count == '0'
      - name: Mirror new sources
        if: steps.open.outputs.count == '0'
        run: uv run catalog-mirror
      - name: Open a pull request with the new mirror sources
        if: steps.open.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain entries)" ]; then
            echo "No new mirror sources."
            exit 0
          fi
          branch="mirror/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add entries
          git commit -m "chore: add mirror sources"
          git push origin "$branch"
          gh pr create \
            --title "Add mirror sources" \
            --body "Automated: mirrors new sources to files.accessiblegames.net." \
            --label mirror
