name: Submit a game
description: Suggest a game for the catalog.
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a game. The catalog lists games that can be downloaded, played in a browser, or got from a store. Give a link straight to the file, or the game's store page.
  - type: input
    id: title
    attributes:
      label: Title
      description: The name of the game.
    validations:
      required: true
  - type: input
    id: developer
    attributes:
      label: Developer
      description: Who made it.
    validations:
      required: true
  - type: input
    id: download
    attributes:
      label: Direct download URL
      description: A link to the file itself, not a web page about it. For a web game, the address where it is played. Leave it empty for a game that is only on a store.
  - type: textarea
    id: stores
    attributes:
      label: Store pages
      description: The game's page on Steam, itch.io, GOG or another store. One address per line.
  - type: input
    id: homepage
    attributes:
      label: Homepage
      description: The developer's page for the game, if there is one.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Web
  - type: dropdown
    id: install_type
    attributes:
      label: Install type
      options:
        - Zip
        - 7z
        - Installer
        - Single exe
        - Web game
        - Not sure
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A few sentences about the game.
  - type: input
    id: launch
    attributes:
      label: File to launch
      description: The file that starts the game after it is installed, if you know it.
  - type: checkboxes
    id: direct
    attributes:
      label: Confirmation
      options:
        - label: "Each address above is what its box asks for: a direct file download, a web game's address, or the game's own store page"
          required: true
